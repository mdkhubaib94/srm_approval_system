# ─────────────────────────────────────────────────────────────────────────────
# SRM PRIME Approval System — on-premise nginx site config
#
# nginx does two jobs here, and the whole design follows from keeping them on
# ONE origin:
#
#   /        → the built SPA in dist/
#   /api/*   → the Node backend, with the /api prefix stripped
#
# Same-origin is not a convenience, it is what makes authentication work. The
# `jwt` refresh cookie is SameSite=Lax, so it is only sent on same-site
# requests; if the browser talked to the API on another origin, /auth/refresh
# would see no cookie and every page reload would sign the user out. It also
# means there is no CORS to configure and no backend hostname compiled into the
# JavaScript bundle — the same dist/ deploys to every environment.
#
# Install:
#   sudo cp srm-approval.conf /etc/nginx/sites-available/srm-approval
#   sudo ln -s /etc/nginx/sites-available/srm-approval /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Everything marked CHANGE ME must be set for your site.
# ─────────────────────────────────────────────────────────────────────────────

# The Node backend (server.js). Keep it bound to localhost so it is reachable
# only through nginx — nothing should hit :5000 directly from the network.
upstream srm_backend {
    server 127.0.0.1:5000;          # CHANGE ME if the backend is elsewhere
    keepalive 32;
}

# ─── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name srm-approval.example.edu;   # CHANGE ME

    # Leave this reachable over HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name srm-approval.example.edu;   # CHANGE ME

    ssl_certificate     /etc/ssl/certs/srm-approval.crt;      # CHANGE ME
    ssl_certificate_key /etc/ssl/private/srm-approval.key;    # CHANGE ME

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The built SPA. `npm run build` output, copied here.
    root /var/www/srm-approval;             # CHANGE ME
    index index.html;

    server_tokens off;

    # Attachments (indent PDFs, bulk-upload spreadsheets, SOP documents) are
    # posted through this proxy. Keep at or above the backend's own multer
    # limit, or uploads fail at nginx with 413 before reaching the API.
    client_max_body_size 25m;

    # ─── Security headers ─────────────────────────────────────────────────
    # `always` so these are still sent on 4xx/5xx responses.
    #
    # connect-src is 'self' alone because the API is same-origin. If you ever
    # set VITE_API_URL to a cross-origin backend, that origin has to be added
    # here too or every API call is blocked with no visible error.
    #
    # script-src has no 'unsafe-inline': a Vite production build emits no
    # inline scripts (verified against dist/index.html). style-src does need
    # it — React writes inline style attributes.
    # img/font/frame allow data: and blob: for attachment previews, which are
    # opened as blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── API → backend ────────────────────────────────────────────────────
    # The trailing slash on proxy_pass is what strips the prefix:
    #   /api/requests   → /requests
    #   /api/auth/login → /auth/login
    # Removing that slash silently forwards /api/... to the backend, and every
    # route 404s.
    location /api/ {
        proxy_pass http://srm_backend/;
        proxy_http_version 1.1;

        # The configured server name, not the client-supplied Host request
        # header, so a spoofed Host can't reach the backend.
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required. The backend runs `trust proxy` and derives cookie `Secure`
        # and its rate-limit keys from these. Without X-Forwarded-Proto it sees
        # a plain-http request and the refresh cookie is rejected by the
        # browser as insecure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header Connection        "";

        # SOP indexing and PDF/OCR work can outlast the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Credentials must never be cached by an intermediary.
        proxy_buffering off;
    }

    # ─── Static assets ────────────────────────────────────────────────────
    # Vite fingerprints these filenames (index-CX_cc94R.js), so a stale copy is
    # impossible — cache them as long as we are allowed to.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Files served from public/ keep stable names (templates, the self-hosted
    # SheetJS bundle, institution images), so they get a short cache instead.
    location ~* \.(?:xlsx|svg|png|jpe?g|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────
    # React Router owns the URL space. Any path that is not a real file must
    # return index.html, or deep links and refreshes 404 — /requests/<id> is a
    # client-side route, there is no such file on disk.
    #
    # index.html itself is never cached, so a redeploy takes effect on the next
    # load rather than whenever a browser decides to revalidate.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
