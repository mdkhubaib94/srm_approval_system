[project]
name = "srm-approval-backend"
version = "0.1.0"
description = "SRM Approval System backend — FastAPI + PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "fastembed>=0.4.2",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All async tests/fixtures share one session-scoped event loop. Required
# because app.db.base caches a single AsyncEngine/connection pool at module
# scope (matching the app's real runtime, where there's exactly one loop) —
# a fresh event loop per test would otherwise try to reuse asyncpg
# connections across event loops and crash on teardown.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
