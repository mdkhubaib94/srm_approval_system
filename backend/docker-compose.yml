name: srm-backend-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: srm_approval
    ports:
      # Host port 5442 (not 5432) — a native PostgreSQL service already owns
      # 5432 on this machine, and the two silently collide otherwise.
      - "5442:5432"
    volumes:
      - srm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  srm_pg_data:
